<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mouch! — a private migraine diary that learns your patterns. Mouch it out!">
<meta name="theme-color" content="#F6F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mouch!">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mouch!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 480px) of bento tiles; floating pill tab bar + coral "Ouch!" button. Check-in is a full-screen indigo flow, Attack a dim one. */
:root{
  --coral:#FF786E; --indigo:#22243B; --lav:#9B82F6; --mist:#A9DFD0; --cloud:#F6F4F0;
  --bg:#F6F4F0; --card:#FFFFFF; --card-2:#F0EDE7; --line:#E6E1D8; --ink:#1C1E33; --ink-2:#4A4C61; --ink-3:#77788C;
  --coral-tint:#FFDDD8; --lav-tint:#E4DDFD; --mist-tint:#D6F0E7; --on-coral:#22243B; --on-ink:#F6F4F0;
  --warn:#9A5B00; --warn-bg:#FCEBCF; --danger:#B83A31;
  --shadow:0 10px 30px rgba(34,36,59,.12); --edge:0 0 0 1px rgba(28,30,51,.05), 0 8px 20px rgba(28,30,51,.05);
  --r1:#E5544B; --r2:#F0675D; --r3:#FF786E; --r4:#FF9C92; --r5:#D9D3C9; --r6:#C6E6DC; --r7:#A9DFD0; --r8:#C4B6FA; --r9:#AF9BF8; --r10:#9B82F6;
  --f-ui:'Geist','Noto Sans Ethiopic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-brand:'Bricolage Grotesque','Geist',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121326; --card:#25273F; --card-2:#333551; --line:#40426A; --ink:#FBF9F5; --ink-2:#CBCBDC; --ink-3:#9D9EB5;
  --coral-tint:#47293A; --lav-tint:#2F2A57; --mist-tint:#1E3A3C; --on-ink:#16172A; --warn:#F2C27B; --warn-bg:#3A3022; --danger:#FF9C92;
  --shadow:0 10px 30px rgba(0,0,0,.35); --edge:0 0 0 1px rgba(255,255,255,.07); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121326; --card:#25273F; --card-2:#333551; --line:#40426A; --ink:#FBF9F5; --ink-2:#CBCBDC; --ink-3:#9D9EB5;
  --coral-tint:#47293A; --lav-tint:#2F2A57; --mist-tint:#1E3A3C; --on-ink:#16172A; --warn:#F2C27B; --warn-bg:#3A3022; --danger:#FF9C92;
  --shadow:0 10px 30px rgba(0,0,0,.35); --edge:0 0 0 1px rgba(255,255,255,.07); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--lav);outline-offset:3px}
.app{max-width:480px;margin:0 auto;padding-block:12px 140px;display:flex;flex-direction:column;gap:10px}
h1,h2,h3,p{margin:0}
.eth{font-family:'Noto Sans Ethiopic',var(--f-ui)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px;line-height:20px;color:var(--ink-2)}
.tiny{font-size:12.5px;line-height:17px;color:var(--ink-2)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 2px 10px;gap:12px}
.hello{font-weight:400;font-size:clamp(36px,10vw,44px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
.date{margin-top:8px;font-size:15px;color:var(--ink-2)}
.roundbtn{width:52px;height:52px;border-radius:18px;background:var(--card);display:grid;place-items:center;color:var(--ink);flex:none}
.wordmark{font-family:var(--f-brand);font-weight:800;letter-spacing:-.04em}
.wordmark i{font-style:normal;color:var(--coral)}

/* tiles */
.tile{background:var(--card);box-shadow:var(--edge);border-radius:24px;padding:16px 16px 18px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile.coral{background:var(--coral);color:var(--on-coral)}
.tile.coral .small,.tile.coral .tiny,.tile.coral .label{color:var(--on-coral)}
.tile.lav{background:var(--lav-tint)}
.tile.mist{background:var(--mist-tint)}
.tile.ink{background:var(--indigo);color:#F6F4F0}
.tile.ink .small,.tile.ink .tiny,.tile.ink .label{color:#C9C9DA}
.t-head{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:500;gap:8px}
.t-big{font-weight:400;font-size:30px;line-height:1.05;letter-spacing:-.03em}
.t-huge{font-weight:600;font-size:64px;line-height:.95;letter-spacing:-.05em}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.span2{grid-column:span 2}
.panel{background:var(--lav-tint);border-radius:32px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-weight:400;font-size:24px;letter-spacing:-.02em}
.link{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:44px;display:inline-flex;align-items:center}

/* orb */
.orb{position:absolute;pointer-events:none}
.orb::before,.orb::after{content:"";position:absolute;border-radius:50%}
.orb::before{inset:-22%;background:var(--lav);opacity:.55;filter:blur(28px)}
.orb::after{inset:12%;background:var(--coral);filter:blur(1.5px)}
.tile.coral .orb::after{background:#FFB3A9}
.tile.coral .orb::before{background:#FFF3E9;opacity:.5}

/* pills & chips */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:1.2px solid var(--ink);display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--on-ink)}
.chip{min-height:48px;padding:0 18px;border-radius:999px;background:var(--card-2);display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:500}
.chip.on{background:var(--ink);color:var(--on-ink)}
.chip.add{background:transparent;border:1.4px dashed var(--ink-3);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(34,36,59,.08)}
.tile.ink .tag,.dark .tag{background:rgba(246,244,240,.12)}

/* buttons */
.btn{min-height:52px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15.5px;background:var(--card-2);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--on-ink)}
.btn.coral{background:var(--coral);color:var(--on-coral)}
.btn.ghost{background:transparent;border:1.2px solid var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px;white-space:nowrap}
.btn.danger{background:transparent;color:var(--danger);border:1.2px solid currentColor}
.row2{display:flex;gap:8px}.row2>*{flex:1}

/* rating */
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rate button{height:60px;border-radius:20px;background:var(--card-2);font-size:22px;font-weight:500;position:relative;font-variant-numeric:tabular-nums}
.rate button::after{content:"";position:absolute;left:38%;right:38%;bottom:9px;height:4px;border-radius:2px;background:var(--rc)}
.rate button.on{background:var(--rc);color:#22243B;font-weight:600}
.rate button.on::after{display:none}
.rate.picked button:not(.on){color:var(--ink-3)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}

/* toggle / stepper / seg */
.tog{width:56px;height:34px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--ink-3);transition:left .18s}
.tog.on{background:var(--lav);border-color:var(--lav)}
.tog.on::after{left:25px;background:#FDFBF8}
.step{display:inline-flex;align-items:center;background:var(--card-2);border-radius:999px;padding:3px}
.step button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.step output{min-width:64px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--card-2);border-radius:999px;padding:4px}
.seg button{min-height:44px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);padding:0 6px}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;padding:6px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow>span{min-width:0}

/* tab bar */
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.dock-in{width:100%;max-width:480px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.dock-row{display:flex;gap:8px;align-items:center}
.tabbar{flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.tab{height:52px;min-width:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2)}
.tab.on{background:var(--card-2);color:var(--ink);padding:0 16px 0 6px;font-weight:600;font-size:15px}
.tab.on .dot{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.ouch{width:64px;height:64px;border-radius:50%;background:var(--coral);color:#22243B;font-family:var(--f-brand);font-weight:800;font-size:16px;letter-spacing:-.02em;box-shadow:var(--shadow);flex:none}
.ouch.live{width:auto;padding:0 18px;border-radius:999px;font-family:var(--f-ui);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.livebar{display:flex;align-items:center;justify-content:space-between;background:var(--indigo);color:#F6F4F0;border-radius:22px;min-height:56px;padding:0 8px 0 18px;box-shadow:var(--shadow);font-size:14.5px}
.livebar b{font-weight:600}

/* ring */
.ring{position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring span{font-weight:500}

/* toast / banner */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--indigo);color:#F6F4F0;border-radius:999px;padding:14px 22px;font-weight:600;z-index:40;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.notif{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(448px,calc(100% - 24px));background:rgba(34,36,59,.96);color:#F6F4F0;border-radius:24px;padding:14px 16px;z-index:50;box-shadow:0 18px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:6px}
.notif .nh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C9C9DA}
.notif .appi{width:22px;height:22px;border-radius:7px;overflow:hidden;display:grid;place-items:center}
.notif p{font-size:15px;line-height:21px}
.notif .na{display:flex;gap:8px;margin-top:4px}
.notif .na button{flex:1;min-height:44px;border-radius:14px;background:rgba(246,244,240,.12);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:no-preference){.notif{animation:drop .35s ease-out}.toast{animation:rise .25s ease-out}}
@keyframes drop{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes rise{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(22,23,42,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:32px 32px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);align-self:center}

/* full-screen flows */
.full{position:fixed;inset:0;z-index:30;overflow:auto;display:flex;justify-content:center;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.full-in{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;padding-block:12px 24px}
.ci{background:#22243B;color:#F6F4F0}
.ci .muted,.ci .small{color:#C2C2D6}
.ci-top{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:6px}
.ci-top .ctx{text-align:center;font-size:13.5px;color:#C2C2D6}
.ci-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#F6F4F0}
.ci-later{min-height:48px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14.5px;color:#F6F4F0}
.ci-q{font-weight:500;font-size:clamp(28px,7.6vw,34px);line-height:1.15;letter-spacing:-.02em;text-align:center;text-wrap:balance}
.ci-hint{text-align:center;font-size:16px;color:#C2C2D6;margin-top:10px}
.ci-ans{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cpill{min-height:60px;padding:10px 24px;border-radius:999px;background:#3A3C5A;color:#F6F4F0;font-size:16.5px;font-weight:500;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.cpill small{font-size:13px;color:#C9C9DA;font-weight:400;margin-top:2px}
.cpill.on{background:var(--coral);color:#22243B}
.cpill.on small{color:#22243B}
.cpill.wide{width:100%}
.cpill.row{flex-direction:row;gap:6px}
.cpill.sm{min-height:48px;padding:6px 16px;font-size:15px}
.ci-g{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C2C2D6;margin:18px 0 10px}
.cuis{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cuis::-webkit-scrollbar{display:none}
.cuis-b{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.4px solid #5A5C80;color:#E6E6F0;font-weight:500;font-size:14.5px}
.cuis-b.on{background:#F6F4F0;color:#22243B;border-color:#F6F4F0}
.ci-sum{margin-top:16px;background:#2E3050;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.mbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#3A3C5A}
.mbar i{display:block;height:100%}.mbar .c{background:var(--coral)}.mbar .p{background:var(--mist)}
.csq{width:calc((100% - 40px)/5);aspect-ratio:1;max-width:76px;border-radius:24px;background:#3A3C5A;font-size:24px;font-weight:500;color:#F6F4F0}
.csq.six{width:calc((100% - 50px)/6)}
.csq.on{background:var(--coral);color:#22243B}
.ci-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#55577A}.dots i.on{background:var(--coral)}
.arrow{min-width:84px;height:52px;border-radius:999px;border:1.4px solid #F6F4F0;display:grid;place-items:center;color:#F6F4F0;padding:0 16px;font-weight:600}
.arrow.fill{background:#F6F4F0;color:#22243B}
.ci .step{background:#3A3C5A}
.ci textarea{width:100%;min-height:150px;border-radius:24px;border:0;background:#3A3C5A;color:#F6F4F0;padding:16px;font-size:16px;resize:none}
.ci .seg{background:#3A3C5A}.ci .seg button{color:#C9C9DA}.ci .seg button.on{background:var(--coral);color:#22243B}
.ci input[type=text]{min-height:52px;border-radius:999px;border:0;background:#3A3C5A;color:#F6F4F0;padding:0 18px;flex:1;min-width:0}

/* attack — dim, no motion */
.atk{background:#0F1020;color:#9C9AB0}
.atk *{animation:none!important;transition:none!important}
.atk .muted,.atk .small,.atk .label{color:#7E7C94}
.atk .card{background:#17182B;border-radius:22px;padding:14px}
.atk .chip{background:#1C1D33;color:#9C9AB0}
.atk .chip.on{background:#34364F;color:#C4C1D3}
.atk .btn{background:#1C1D33;color:#B3B0C4}
.atk .btn.dark{background:#3A3550;color:#CFCBDC}
.atk .step{background:#1C1D33}
.atk .seg{background:#1C1D33}.atk .seg button{color:#8A889F}.atk .seg button.on{background:#3A3550;color:#CFCBDC}
.atk .lrow{border-color:#1F2035}
.atk .tog{background:#1C1D33;border-color:#2A2B44}
.timer{font-weight:300;font-size:76px;line-height:1;letter-spacing:-.04em;color:#B9B6C9}
.hm .rg{fill:#1C1D33;stroke:#3A3B57;stroke-width:1.5;cursor:pointer}
.hm .rg.on{fill:#5A3340;stroke:#7E4A55}
.hm .ol{fill:none;stroke:#4A4B66;stroke-width:1.5}
.cb{display:grid;grid-template-columns:26px 1fr;gap:12px;text-align:left;padding:14px 4px;border-top:1px solid #1F2035;font-size:15px;line-height:21px;width:100%;color:#A9A6BC}
.cb:first-child{border-top:0}
.cb i{width:24px;height:24px;border-radius:7px;border:1.6px solid #6E6C85}

/* red flag */
.flag{background:#6E1A16;color:#FFEDE8}
.flag .btn{background:#FFEDE8;color:#6E1A16;font-size:18px;min-height:60px}

/* onboarding */
.ob{background:#22243B;color:#F6F4F0}
.ob .small{color:#C2C2D6}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{text-align:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.cell{aspect-ratio:1/1.12;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;background:var(--card);font-variant-numeric:tabular-nums;min-width:0}
.cell .d{font-size:14px;font-weight:600}
.cell .r{font-size:11px;font-weight:600;opacity:.85}
.cell.rated{color:#22243B}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.future{background:transparent;color:var(--ink-3)}
.cell.blank{background:transparent}
.cell .ad{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:currentColor}
.cell .md{position:absolute;bottom:5px;left:50%;width:14px;margin-left:-7px;height:3px;border-radius:2px;background:currentColor;opacity:.7}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:220px}
.bar{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0}
.bar i{width:100%;max-width:46px;border-radius:999px;display:block}
.bar span{font-size:14px;color:var(--ink-2)}
.bar b{font-size:13px;font-weight:500;color:var(--ink-2)}

/* insights */
.stat b{display:block;font-weight:400;font-size:34px;letter-spacing:-.03em;line-height:1.05}
.meter{height:12px;border-radius:999px;background:var(--card-2);position:relative;overflow:visible}
.meter i{display:block;height:100%;border-radius:999px;background:var(--lav)}
.meter i.warn{background:#E8A33C}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
.pbar{height:12px;border-radius:999px;background:var(--card-2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;border:1.2px solid var(--ink-2);color:var(--ink-2);white-space:nowrap}
.badge.test{border-color:var(--lav);color:var(--lav)}
.badge.likely{background:var(--lav);border-color:var(--lav);color:#22243B}
.badge.conf{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.badge .bd{display:inline-flex;gap:2px}.badge .bd i{width:5px;height:5px;border-radius:50%;border:1.2px solid currentColor}.badge .bd i.f{background:currentColor}
.lag{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));font-size:14px}
.lag span{padding:9px 4px;border-top:1px solid var(--line);text-align:center}
.lag span:nth-child(4n+1){text-align:left}
textarea.paste{width:100%;min-height:140px;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:14px;font:13px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
pre.json{background:var(--card);border-radius:18px;padding:14px;font:12px/1.5 ui-monospace,Menlo,monospace;overflow:auto;max-height:240px;margin:0;white-space:pre}
.rec{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid rgba(34,36,59,.12)}
.rec:first-of-type{border-top:0}
.rec .ri{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink)}
.rec b{font-weight:600}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;min-height:62px;position:relative}
.tl::before{content:"";position:absolute;left:13px;top:0;bottom:0;border-left:1.5px dashed var(--ink-3)}
.tl:first-child::before{top:50%}.tl:last-child::before{bottom:50%}
.tl .nd{width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;z-index:1}
.tl .nd i{width:9px;height:9px;border-radius:50%}
input.inp{min-height:50px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 18px;min-width:0;flex:1}

/* rating meaning — shown before a rating is saved */
.meaning{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.meaning .mh{display:flex;gap:12px;align-items:center}
.meaning .mn{width:48px;height:48px;border-radius:16px;background:var(--rc);color:#22243B;display:grid;place-items:center;font-weight:600;font-size:22px;flex:none}
.meaning .mt{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.ci .rate button{background:#3A3C5A;color:#F6F4F0}
.ci .rate button.on{background:var(--rc);color:#22243B}
.ci .rate.picked button:not(.on){color:#8E8FAB}
.ci .ends{color:#C2C2D6}
.ci .meaning{border-color:#3A3C5A}
.ci .btn{background:#3A3C5A;color:#F6F4F0}
.ci .btn.dark{background:#F6F4F0;color:#22243B}

/* day log sections */
.sec{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;min-height:62px;border-top:1px solid var(--line);text-align:left;width:100%}
.sec:first-of-type{border-top:0}
.sec .si{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card-2)}
.sec.done .si{background:var(--mist);color:#22243B}
.sec.locked{color:var(--ink-3)}
.sec b{font-weight:600;display:block}

/* read-only (older than 3 days) */
.ro{pointer-events:none;opacity:.6}
.lock-note{display:flex;gap:10px;align-items:center;background:var(--card-2);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--ink-2)}

/* passcode */
.ob input[type=password]{min-height:60px;border-radius:999px;border:0;background:#3A3C5A;color:#F6F4F0;padding:0 22px;font-size:20px;width:100%;letter-spacing:.2em;text-align:center}
.err{color:#FFB3A9;font-size:15px;text-align:center;min-height:22px}

/* health setup */
.copyrow{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;padding:8px 8px 8px 14px}
.copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;font:12.5px/1.4 ui-monospace,Menlo,monospace}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
ol.steps li b{display:block;margin-bottom:2px}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
</style>
</head>

<script>
(function(){

const I = {
  home:'<path d="M4 11l8-6.5 8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 15.5h5"/>',

  pill:'<path d="M10.5 3.5a4.95 4.95 0 0 1 7 7l-7 7a4.95 4.95 0 0 1-7-7zM7 10l7 7"/>', drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  bowl:'<path d="M4 11h16a8 8 0 0 1-16 0zM9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/>', no:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',

  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>', walk:'<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6-2.5-2 1-5 3 3 3 1M9.5 8L7 11"/>',

};
const ic = (n,c='') => '<svg class="ic '+c+'" viewBox="0 0 24 24" aria-hidden="true">'+I[n]+'</svg>';

/* ---------- state ---------- */
const STORE='mouch.v3';
function load(){ try{ const s=localStorage.getItem(STORE); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} queueSync(); }

function seed(){
  rnd = 7;
  const t = NOW(), days = {}, attacks = [], doses = [];
  const R = [6,7,5,7,6,null,8,7,3,5,6,9,null,7,2,4,6,7,null,8,10,6,5,3,6,7,null,9,6];
  const tags = ['deadline','long drive','site visit','film shoot','fasting','coffee ceremony'];
  R.forEach((r,i)=>{
    const k = key(addDays(t, i-R.length));
    const pain = r!=null && r<=4, great = r!=null && r>=9;
    const d = { rating:r, headache: pain || (r===5 && rand()<.5), press: +(pain? -(4+rand()*4) : great? (rand()*1.2-.3) : (rand()*3-1.8)).toFixed(1) };
    d.mac = Math.round(pain? 470+rand()*110 : great? 290+rand()*90 : 360+rand()*120);
    d.lastActive = pain && rand()<.75 ? fromMin(22*60+40+Math.round(rand()*100)) : fromMin(19*60+Math.round(rand()*150));
    if(pain || great){
      const short = pain ? rand()<.78 : rand()<.15;
      d.ci = {
        sleep: short ? {usual:false, bed:fromMin(24*60+15+Math.round(rand()*4)*15), wake:'06:30'} : {usual:true},
        stress: pain? 3+Math.round(rand()*2) : 1+Math.round(rand()),
        stressY: pain? (rand()<.4? 5 : 3) : 2,
        meal: pain ? (rand()<.65?'today':'no') : (rand()<.2?'yesterday':'no'),
        caffeine: pain ? 3+Math.round(rand()*2) : 2,
        lastCaf: pain ? 'late' : 'morning',
        water: pain ? (rand()<.6?'no':'yes') : 'yes',
        ex: great ? 'light' : 'none', exY: great? 'hard':'none',
        screen: pain ? (rand()<.88?'yes':'no') : (rand()<.25?'yes':'no'),
        phone: pain ? '3-5' : '1-3',
        alcohol: rand()<.15?'yes':'no',
        signs: pain ? (rand()<.7?['Neck tension']:[]).concat(rand()<.4?['Yawning']:[]) : [],
        tags: pain ? (rand()<.6?['deadline']:[]).concat(rand()<.4?['film shoot']:[]) : (rand()<.3?['coffee ceremony']:[]),
        meals: pain ? { breakfast: rand()<.5?{skip:true,time:'08:00',items:[]}:{skip:false,time:'10:45',items:['Firfir','Sugary tea']},
                        lunch:{skip:false,time:'15:00',items: rand()<.5?['Pasta','Soda']:['Injera','Shiro wot','Soda']},
                        dinner:{skip:false,time:'21:45',items:['Injera','Firfir']}, snacks:{items:['Cake or biscuits','Sugary tea']} }
                    : { breakfast:{skip:false,time:'07:45',items:['Eggs (enkulal)','Bread (dabo)']}, lunch:{skip:false,time:'13:00',items:['Beyaynetu','Injera']},
                        dinner:{skip:false,time:'19:30',items:['Tibs','Salad']}, snacks:{items:['Fruit','Peanuts or nuts']} },
        note: ''
      };
    }
    days[k]=d;
    if(r!=null && r<=3){
      const st = 13+Math.round(rand()*7);
      const med = rand()<.55 ? 'Volt Fast' : 'Gofen';
      doses.push({id:'d'+i, med, date:k, time:fromMin(st*60+20), qty:1, atk:'a'+i, relief: med==='Volt Fast' ? (rand()<.75?'full':'some') : (rand()<.5?'some':'none')});
      if(r<=2) doses.push({id:'d'+i+'b', med:'Gofen', date:k, time:fromMin(st*60+270), qty:1, atk:'a'+i, relief:'some'});
      attacks.push({ id:'a'+i, date:k, start:fromMin(st*60), end:fromMin(st*60+150+Math.round(rand()*180)), peak: r<=2?8:6+Math.round(rand()),
        regions:['forehead', rand()<.5?'ltemple':'rtemple'], extra:rand()<.4?['Neck']:[], symptoms:['Nausea','Light hurts'].concat(rand()<.3?['Sound hurts']:[]),

  const yk = key(addDays(t,-1));
  days[yk] = { rating:6, headache:false, press:-1.1, mac:582, lastActive:'23:40',

      meals:{breakfast:{skip:true,time:'08:00',items:[]}, lunch:{skip:false,time:'15:10',items:['Pasta','Soda']}, dinner:{skip:false,time:'21:50',items:['Injera','Firfir']}, snacks:{items:['Cake or biscuits','Sugary tea']}} } };
  // a dose from today that needs a relief answer
  const tk = key(t);
  days[tk] = { rating:null, headache:false, press:-2.4, mac:430, lastActive:'' };

  let alt=0; Object.keys(days).sort().forEach(k=>{ const r=days[k].rating; if((r===4||r===5||r===6) && (days[k].headache||r===4)){ const med=(alt++%2)?'Volt Fast':'Gofen'; days[k].headache=true; doses.push({id:'s'+k, med, date:k, time:'16:10', qty:1, atk:null, relief: med==='Volt Fast'?(alt%3?'full':'some'):(alt%3?'some':'none')}); } });
  doses.push({id:'dy', med:'Gofen', date:yk, time:'15:30', qty:1, atk:null, relief:null});
  const until = key(addDays(t,19));
  return {
    v:1, name:'Barkneh', onboarded:false, sample:true,
    theme:'light', nightDark:false,
    bands:{pain:4, great:9},
    reminder:{on:true, time:'21:00'},
    meds:[{id:'m1',name:'Gofen',note:'Ibuprofen 400 mg',cls:'simple',nsaid:true,active:true},{id:'m2',name:'Volt Fast',note:'Diclofenac potassium 50 mg',cls:'simple',nsaid:true,active:true}],

    plan:{ month: MON[addDays(t,-28).getMonth()]+' review', received:key(addDays(t,-6)),

      food:[{id:'f1',rule:'No refined carbs or sweets after 4 PM',detail:'White bread, pasta, cake, biscuits, soda, sugary tea.',until,why:'Testing whether evening sugar dips come before your attacks.'},

      nudges:[{id:'n1',message:'Pressure change tomorrow — carry your medication, protect sleep.',condition:'pressure_drop_tomorrow',on:true},
              {id:'n2',message:'Short night. Keep caffeine to the morning and eat on time.',condition:'short_sleep',on:true},
              {id:'n3',message:'Moon phase alert',condition:'full_moon',on:true}]
    },
    pastPlans:[{month:'August review', findings:2, experiments:1}],
  };
}

/* a clean diary: the seed's settings without its sample month */
function fresh(){
  const f=seed();
  return Object.assign(f,{sample:false, days:{}, attacks:[], doses:[], pastPlans:[],
    plan:Object.assign(f.plan,{month:'No plan yet', received:null, findings:[], experiments:[], food:[], nudges:[]}),
    weather:Object.assign(f.weather,{today:0, tomorrow:0}),
    screen:Object.assign(f.screen,{mac:{on:false}, pc:{on:false}})});
}
/* v2: the sample month goes, and the diary gains a passcode, push notifications, timed day-log sections, live weather and Apple Health */
function migrate(){
  if(S.sample) S=Object.assign(fresh(), {name:S.name, theme:S.theme, nightDark:S.nightDark});
  if(!S.notify) S.notify={on:false, morning:'08:00', midday:'13:00', water:'16:00', evening:'19:30', rating:(S.reminder&&S.reminder.time)||'21:00', weather:true, doses:true, attack:true};
  if(!S.sections) S.sections={morning:'05:00', midday:'12:00', evening:'18:00'};
  if(!S.health) S.health={token:null, last:null};
  if(S.lock===undefined) S.lock=null;
  if(!S.device) S.device='d-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
  S.v=2;
}
let S = load() || seed();
migrate(); save();
// keep "today" fresh if the stored seed is from an earlier day
if(!S.days[TODAY()]) S.days[TODAY()] = {rating:null, headache:false, press:S.weather.today, mac:0, lastActive:''};

const V = { view: S.onboarded?(S.lock?'today':'setlock'):'onboard', locked:!!S.lock, pick:null, pass1:'', pass2:'', passIn:'', passErr:'', forgot:false, ob:0, dayKey:null, calMonth:null, insMonth:null, recentFilter:'all', ci:null, atk:null, flagFrom:null, sheet:null, followUp:false, importText:'', importResult:null, delTyped:'', newTag:'', newMed:'', newMedCls:'nsaid', expandUnusual:false, ciTag:'' };

/* ---------- theme ---------- */
function applyTheme(){
  const h = NOW().getHours();

function factorStats(keys){
  const ks = keys || Object.keys(S.days);
  const pain = ks.filter(k=>S.days[k]&&S.days[k].ci&&band(S.days[k].rating)==='pain');
  const great = ks.filter(k=>S.days[k]&&S.days[k].ci&&band(S.days[k].rating)==='great');
  const totalAtk = S.attacks.filter(a=>a.done).length;
  const row = (label, f) => {
    const p = pain.filter(k=>f(S.days[k].ci,S.days[k],k)).length, g = great.filter(k=>f(S.days[k].ci,S.days[k],k)).length;
    const pr = pain.length? p/pain.length:0, gr = great.length? g/great.length:0, diff = pr-gr;
    let level = 'hunch';
    if(pain.length>=5 && diff>=.4) level = totalAtk>=24 ? 'likely' : 'worth testing';
    return {label, p, g, pn:pain.length, gn:great.length, diff, level};
  };
  return {
    pain, great,
    factors: FACTORS.map(F=>Object.assign(row(F.label, F.test),{id:F.id})).filter(r=>r.p+r.g>0).sort((a,b)=>b.diff-a.diff),
    tags: allTags().map(t=>row(t, c=>c.tags&&c.tags.includes(t))).filter(r=>r.p+r.g>0).sort((a,b)=>b.diff-a.diff),
    signs: SIGNS.map(s=>row(s, c=>c.signs&&c.signs.includes(s))).filter(r=>r.p+r.g>0).sort((a,b)=>b.diff-a.diff)
  };
}

/* forecast: additive score from the latest check-in + tomorrow's pressure, weighted by your own pain-vs-great history */
function forecast(){
  const ks = Object.keys(S.days).filter(k=>S.days[k].ci).sort();
  const today = TODAY();
  const base = ks.length ? ks[ks.length-1] : today;
  let d = S.days[base] || {}, c = d.ci;
  const filled = o => Object.fromEntries(Object.entries(o||{}).filter(([k,v])=>v!=null&&!(Array.isArray(v)&&!v.length)));
  if(ks.length>1 && Object.keys(filled(c)).length<8){ const prev=S.days[ks[ks.length-2]]; c=Object.assign({}, prev.ci, filled(c)); d=Object.assign({}, prev, d, {mac:d.mac||prev.mac, lastActive:d.lastActive||prev.lastActive}); }
  const target = base===today ? 'tomorrow' : (base===key(addDays(NOW(),-1)) ? 'today' : 'next day');
  const fs = factorStats();
  const personal = id => { const r = fs.factors.find(f=>f.id===id); return r ? clamp(r.diff,0,.8) : 0; };
  const hits = [];
  let score = 8;
  FACTORS.forEach(F=>{ if(F.test(c,d)){ const pts = Math.round(F.w*(1+personal(F.id)*.5)); score+=pts; const r=fs.factors.find(f=>f.id===F.id); hits.push({id:F.id,label:F.label,pts,why:r?r.p+' of '+r.pn+' pain days':''}); } });
  const signs = (c&&c.signs)||[];
  if(signs.length){ const pts=Math.min(14,signs.length*6); score+=pts; hits.push({id:'signs',label:'Early signs: '+signs.join(', ').toLowerCase(),pts,why:'Often a day before an attack'}); }
  if(c&&c.tags&&c.tags.includes('fasting')){ score+=6; hits.push({id:'fast',label:'Fasting',pts:6,why:''}); }
  const pr = target==='tomorrow' ? S.weather.tomorrow : S.weather.today;
  const bigP = fs.pain.filter(k=>Math.abs(S.days[k].press||0)>=S.weather.threshold).length;
  if(Math.abs(pr)>=S.weather.threshold){ score+=12; hits.push({id:'press',label:'Pressure '+(pr>0?'+':'')+pr+' hPa '+target,pts:12,why:fs.pain.length?bigP+' of '+fs.pain.length+' pain days followed a change this big':''}); }
  else if(Math.abs(pr)>=S.weather.threshold/2){ score+=6; hits.push({id:'press',label:'Pressure '+(pr>0?'+':'')+pr+' hPa '+target,pts:6,why:''}); }
  const wx = wxFor(target==='tomorrow' ? key(addDays(NOW(),1)) : TODAY());
  if(wx && wx.aqi>100){ score+=6; hits.push({id:'air',label:'Poor air quality '+target+' (AQI '+wx.aqi+')',pts:6,why:''}); }
  if(wx && wx.uv>=8){ score+=4; hits.push({id:'uv',label:'Very strong sun '+target+' (UV '+Math.round(wx.uv)+')',pts:4,why:''}); }
  score = clamp(score, 4, 96);
  hits.sort((a,b)=>b.pts-a.pts);
  const level = score>=75?'High':score>=55?'Elevated':score>=30?'Moderate':'Low';
  return {score, level, hits, target, base, d, c};
}

    reply_format:{findings:[{text:'',level:'hunch|worth testing|likely|confirmed'}],experiments:[{title:'',rule:'',from:'YYYY-MM-DD',to:'YYYY-MM-DD'}],food:[{rule:'',detail:'',until:'YYYY-MM-DD',why:''}],nudges:[{message:'',condition:'pressure_drop_tomorrow|short_sleep|skipped_meal|late_work|heavy_screen|high_risk',on:true}]}};

function checkPlan(txt){
  let o; const errs=[];
  try{ o=JSON.parse(txt); }catch(e){ return {ok:false, errs:['This isn\'t valid JSON. Copy Claude\'s whole reply, from the first { to the last }.']}; }
  if(!Array.isArray(o.findings)) errs.push('findings: missing or not a list');
  else o.findings.forEach((f,i)=>{ if(!f.text) errs.push('findings['+i+'].text: empty'); if(!['hunch','worth testing','likely','confirmed'].includes(f.level)) errs.push('findings['+i+'].level: use hunch, worth testing, likely or confirmed'); });
  (o.experiments||[]).forEach((e,i)=>{ if(!e.title) errs.push('experiments['+i+'].title: empty'); if(!/^\d{4}-\d\d-\d\d$/.test(e.to||'')) errs.push('experiments['+i+'].to: needs a date like 2026-11-30'); });
  (o.food||[]).forEach((f,i)=>{ if(!f.rule) errs.push('food['+i+'].rule: empty'); if(!/^\d{4}-\d\d-\d\d$/.test(f.until||'')) errs.push('food['+i+'].until: needs a date like 2026-11-30'); });
  return errs.length? {ok:false, errs} : {ok:true, plan:o};
}

/* ---------- passcode ---------- */
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function hashPass(p, salt, it){
  const k=await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:it}, k, 256)));
}
async function setPass(p){ const salt=crypto.getRandomValues(new Uint8Array(16)), it=150000; S.lock={salt:b64(salt), it, hash:await hashPass(p,salt,it)}; save(); }
async function checkPass(p){ return !!S.lock && await hashPass(p, unb64(S.lock.salt), S.lock.it) === S.lock.hash; }
const passIn = (id, label, focus) => '<label for="'+id+'" class="small">'+label+'</label><input type="password" id="'+id+'" data-in="'+id+'" value="'+esc(V[id])+'" autocomplete="'+(id==='passIn'?'current-password':'new-password')+'" autocapitalize="off" autocorrect="off" spellcheck="false"'+(focus?' data-focus="1"':'')+'>';
function vSetLock(){

  h+='<div style="display:flex;flex-direction:column;gap:14px"><h1 class="ci-q">'+(fromPrefs?'Change your passcode':'Create a passcode')+'</h1><p class="small" style="text-align:center;font-size:17px;line-height:1.5">Mouch! asks for it every time you open it, and after 5 minutes away. Any letters or numbers. It can\'t be recovered, so pick one you\'ll remember.</p>'

let wxBusy=false;
async function fetchWx(force){
  const w=S.weather;
  if(wxBusy || navigator.onLine===false || (!force && w.at && Date.now()-Date.parse(w.at)<3600e3)) return;
  wxBusy=true;
  try{
    const q='latitude='+w.lat+'&longitude='+w.lon+'&timezone=auto&past_days=3&forecast_days=2';
    const [f,a]=await Promise.all([
      fetch('https://api.open-meteo.com/v1/forecast?'+q+'&hourly=surface_pressure,relative_humidity_2m&daily=temperature_2m_max,uv_index_max').then(r=>r.json()),
      fetch('https://air-quality-api.open-meteo.com/v1/air-quality?'+q+'&hourly=us_aqi,pm2_5').then(r=>r.json()).catch(()=>null)]);
    const days={}, at=k=>days[k]||(days[k]={});
    const mean=xs=>xs.reduce((s,x)=>s+x,0)/xs.length;
    const byDay=(times, vals, fn)=>{ const g={}; (times||[]).forEach((t,i)=>{ if(vals[i]!=null) (g[t.slice(0,10)]=g[t.slice(0,10)]||[]).push(vals[i]); }); Object.keys(g).forEach(k=>fn(k,g[k])); };
    byDay(f.hourly.time, f.hourly.surface_pressure, (k,xs)=>{ at(k).p=+mean(xs).toFixed(1); });
    byDay(f.hourly.time, f.hourly.relative_humidity_2m, (k,xs)=>{ at(k).hum=Math.round(mean(xs)); });
    f.daily.time.forEach((k,i)=>{ at(k).tmax=f.daily.temperature_2m_max[i]; at(k).uv=f.daily.uv_index_max[i]; });
    if(a&&a.hourly){ byDay(a.hourly.time, a.hourly.us_aqi, (k,xs)=>{ at(k).aqi=Math.round(Math.max(...xs)); }); byDay(a.hourly.time, a.hourly.pm2_5, (k,xs)=>{ at(k).pm=Math.round(mean(xs)); }); }
    const ks=Object.keys(days).sort();
    ks.forEach((k,i)=>{ const p=i&&days[ks[i-1]].p; if(p!=null&&days[k].p!=null) days[k].dp=+(days[k].p-p).toFixed(1); });
    const tk=TODAY(), tm=key(addDays(NOW(),1));
    w.days=days; w.at=new Date().toISOString();
    if(days[tk]&&days[tk].dp!=null) w.today=days[tk].dp;
    if(days[tm]&&days[tm].dp!=null) w.tomorrow=days[tm].dp;
    // keep each logged day's own conditions for the analysis and the monthly export
    ks.filter(k=>k<=tk&&S.days[k]).forEach(k=>{ const x=days[k]; if(x.dp!=null) S.days[k].press=x.dp; S.days[k].wx={aqi:x.aqi, pm:x.pm, uv:x.uv, tmax:x.tmax, hum:x.hum}; });
    save(); softRender();
  }catch(e){}finally{ wxBusy=false; }
}

const looseNum = v => { if(Array.isArray(v)) v=v[0]; if(typeof v==='number') return isFinite(v)?v:undefined; if(typeof v!=='string') return undefined; const m=/-?\d[\d,]*(?:\.\d+)?/.exec(v); if(!m) return undefined; const n=+m[0].replace(/,/g,''); return isFinite(n)?n:undefined; };
function looseTime(v){
  if(Array.isArray(v)) v=v[0];
  if(typeof v!=='string'||!v.trim()) return undefined;
  const s=v.trim();
  if(/^\d{4}-\d\d-\d\dT/.test(s)){ const d=new Date(s); if(!isNaN(d)) return hm(d); }
  const m=/(\d{1,2})[:.](\d{2})(?::\d{2})?\s*([AaPp])?\.?[Mm]?/.exec(s); if(!m) return undefined;
  let h=+m[1]; const mi=+m[2], ap=m[3]&&m[3].toLowerCase();

}
function parseHealth(b, at){
  const pick=(...ks)=>{ for(const k of ks) for(const bk in b) if(bk.toLowerCase().replace(/[^a-z]/g,'')===k) return b[bk]; };
  const o={syncedAt:at}, from=looseTime(pick('bed','sleepfrom','sleepstart')), to=looseTime(pick('wake','sleepto','sleepend'));
  const steps=looseNum(pick('steps','stepcount')), ex=looseNum(pick('exercise','exercisemin','exerciseminutes','exercisetime')), rhr=looseNum(pick('restinghr','restingheartrate','rhr')), hrv=looseNum(pick('hrv','heartratevariability')), per=pick('period','menstrual','menstrualflow');
  if(from&&to&&from!==to){ o.sleepFrom=from; o.sleepTo=to; }
  if(steps!=null&&steps>=0&&steps<200000) o.steps=Math.round(steps);

  return o;
}

  toggleHeadache:()=>{ const d=day(TODAY()); d.headache=!d.headache; save(); render(); },
  editDetail:k=>{ if(!openCheckin(k)) toast('Nothing to fill in yet'); },
  relief:(id,v)=>{ const d=S.doses.find(x=>x.id===id); if(d) d.relief=v; save(); render(); toast('Saved'); },
  logAttackFor:k=>{ if(!editable(k)) return; const a=newAttack(k,false); V.atk=a.id; V.expandUnusual=false; go('attack'); },
  exp:v=>{ const e=S.plan.experiments[0]; if(!e) return; const k=TODAY(); e.done[k] = e.done[k]===(v==='1')? undefined : v==='1'; save(); render(); },
  recent:f=>{ V.recentFilter=f; render(); },
  openDay:k=>{ V.dayKey=k; go('day'); },
  toggleDayHeadache:()=>{ if(!editable(V.dayKey)) return; const d=day(V.dayKey); d.headache=!d.headache; save(); render(); },
  askDel:()=>{ V.confirmDel=true; render(); },
  delDay:v=>{ if(v==='1'&&editable(V.dayKey)){ delete S.days[V.dayKey]; S.attacks=S.attacks.filter(a=>a.date!==V.dayKey); S.doses=S.doses.filter(d=>d.date!==V.dayKey); save(); V.confirmDel=false; go('calendar'); toast('Deleted'); } else { V.confirmDel=false; render(); } },
  openAttack:id=>{ V.atk=id; V.expandUnusual=false; go('attack'); },
  calMove:d=>{ const t=NOW(); let [y,m]=V.calMonth||[t.getFullYear(),t.getMonth()]; m+=+d; if(m<0){m=11;y--;} if(m>11){m=0;y++;} V.calMonth=[y,m]; render(); },
  insMove:d=>{ const t=NOW(); let [y,m]=V.insMonth||[t.getFullYear(),t.getMonth()]; m+=+d; if(m<0){m=11;y--;} if(m>11){m=0;y++;} if(y*12+m>t.getFullYear()*12+t.getMonth()) return; V.insMonth=[y,m]; render(); },
  /* check-in */
  ans:(id,v)=>{ ciAns()[id]=v; save(); render(); setTimeout(ciAdvance, 200); },
  ansN:(id,v)=>{ ciAns()[id]=+v; save(); render(); setTimeout(ciAdvance, 200); },
  ansStay:(id,v)=>{ ciAns()[id]=v; save(); render(); },
  ansPhone:v=>{ ciAns().phone=v; save(); render(); },
  ansM:(id,v)=>{ v=decodeURIComponent(v); const a=ciAns(); a[id]=a[id]||[]; a[id]=a[id].includes(v)?a[id].filter(x=>x!==v):a[id].concat(v); save(); render(); },
  sleepUsual:()=>{ ciAns().sleep={usual:true}; save(); render(); setTimeout(ciAdvance,200); },
  sleepHealth:()=>{ const h=day(V.ci.k).health; ciAns().sleep={usual:false, bed:h.sleepFrom, wake:h.sleepTo}; save(); render(); setTimeout(ciAdvance,200); },
  sleepDiff:()=>{ const a=ciAns(); if(!a.sleep||a.sleep.usual) a.sleep={usual:false,bed:'23:00',wake:'07:00'}; save(); render(); },
  sleepT:(f,dir)=>{ const s=ciAns().sleep; s[f]=STEP15(s[f],+dir); save(); render(); },
  ciTagAdd:()=>{ const t=V.ciTag.trim().toLowerCase(); if(t&&!allTags().includes(t)) S.tags.push(t); if(t){ const a=ciAns(); a.tags=(a.tags||[]).concat(t); } V.ciTag=''; save(); render(); },
  ciNext:()=>ciAdvance(),
  mealT:(slot,dir)=>{ const m=ciAns().meals[slot]; m.time=STEP15(m.time,+dir); deriveMeal(); save(); render(); },
  mealSkip:slot=>{ const m=ciAns().meals[slot]; m.skip=!m.skip; deriveMeal(); save(); render(); },
  cuisine:c=>{ V.cuisine=decodeURIComponent(c); render(); },
  food:(slot,f)=>{ f=decodeURIComponent(f); const m=ciAns().meals[slot]; m.items=m.items.includes(f)?m.items.filter(x=>x!==f):m.items.concat(f); deriveMeal(); save(); render(); },
  foodAdd:slot=>{ const n=(V.ciFood||'').trim(); if(!n) return; if(!FOODS.some(f=>f[0]===n)&&!S.customFoods.includes(n)) S.customFoods.push(n); const m=ciAns().meals[slot]; if(!m.items.includes(n)) m.items.push(n); V.ciFood=''; deriveMeal(); save(); render(); },
  logMeals:()=>{ const s=secState('evening',TODAY())!=='locked'?'evening':'midday'; if(!openCheckin(TODAY(), s)) toast('The midday log opens at '+fmt12(S.sections.midday)); },
  ciSkip:()=>ciAdvance(),
  ciBack:()=>{ V.pick=null; if(V.ci.i===0){ go('today'); return; } V.ci.i--; while(V.ci.i>0 && ciQ(V.ci.i).skipIf && ciQ(V.ci.i).skipIf(ciAns())) V.ci.i--; render(); },
  ciLater:()=>{ save(); go('today'); toast('Saved. Finish any time.'); },
  ciAtk:v=>{ V.ci.askedAtk=true; if(v==='1'){ const a=newAttack(V.ci.k,false); V.atk=a.id; go('attack'); } else render(); },
  ciDone:()=>{ go('today'); },
  /* attack */
  startAttack:()=>{ const a=newAttack(TODAY(),true); V.atk=a.id; V.expandUnusual=false; go('attack'); },
  openLive:()=>{ V.atk=S.live; go('attack'); },
  atkClose:()=>{ go(V.dayKey&&V.view!=='today'?'day':'today'); },
  atkOver:()=>{ const a=S.attacks.find(x=>x.id===V.atk); a.end=hm(NOW()); a.done=true; S.live=null; save(); render(); },
  atkDone:()=>{ save(); go('today'); toast('Attack saved'); },
  atkDelete:()=>{ S.doses.forEach(d=>{ if(d.atk===V.atk) d.atk=null; }); S.attacks=S.attacks.filter(x=>x.id!==V.atk); if(S.live===V.atk) S.live=null; save(); go('today'); toast('Attack deleted'); },
  atkT:(f,dir)=>{ const a=S.attacks.find(x=>x.id===V.atk); a[f]=STEP15(a[f]||a.start,+dir); save(); render(); },
  peak:dir=>{ const a=S.attacks.find(x=>x.id===V.atk); a.peak=clamp((a.peak||0)+ +dir,0,10); save(); render(); },
  dose:id=>{ const a=S.attacks.find(x=>x.id===V.atk), m=S.meds.find(x=>x.id===id); S.doses.push({id:'d'+Date.now(),med:m.name,date:a.date,time:a.done?a.start:hm(NOW()),qty:1,atk:a.id,relief:null}); save(); render(); toast(m.name+' logged'); },
  undoDose:id=>{ S.doses=S.doses.filter(x=>x.id!==id); save(); render(); toast('Removed'); },
  logMed:id=>{ const m=S.meds.find(x=>x.id===id); const live=S.live&&S.attacks.find(x=>x.id===S.live); S.doses.push({id:'d'+Date.now(),med:m.name,date:TODAY(),time:hm(NOW()),qty:1,atk:live?live.id:null,relief:null}); save(); render(); toast(m.name+' logged'); },
  doseRelief:(id,v)=>{ const d=S.doses.find(x=>x.id===id); if(d) d.relief=v; save(); render(); },
  sym:s=>{ s=decodeURIComponent(s); const a=S.attacks.find(x=>x.id===V.atk); a.symptoms=a.symptoms.includes(s)?a.symptoms.filter(x=>x!==s):a.symptoms.concat(s); save(); render(); },
  did:s=>{ s=decodeURIComponent(s); const a=S.attacks.find(x=>x.id===V.atk); a.did=a.did.includes(s)?a.did.filter(x=>x!==s):a.did.concat(s); save(); render(); },
  extra:s=>{ s=decodeURIComponent(s); const a=S.attacks.find(x=>x.id===V.atk); a.extra=a.extra.includes(s)?a.extra.filter(x=>x!==s):a.extra.concat(s); save(); render(); },
  lost:v=>{ const a=S.attacks.find(x=>x.id===V.atk); a.lost=a.lost===v?null:v; save(); render(); },
  region:r=>{ const a=S.attacks.find(x=>x.id===V.atk); a.regions=a.regions.includes(r)?a.regions.filter(x=>x!==r):a.regions.concat(r); save(); render(); },
  unusual:()=>{ V.expandUnusual=!V.expandUnusual; render(); },
  flag:i=>{ V.flagged=[+i]; go('flag'); },
  flagOk:()=>{ V.expandUnusual=false; go('attack'); },
  /* plan */
  sheet:(t,dev)=>{ V.sheet={type:t, dev, code: String(100000+Math.floor(Math.random()*899999)).replace(/(\d{3})(\d{3})/,'$1 $2')}; if(t==='import'){ V.importResult=null; } render(); },
  sheetClose:()=>{ V.sheet=null; render(); },
  copyExport:()=>{ const txt=JSON.stringify(exportObj(),null,2); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>selectPre()); } else selectPre(); },
  sampleReply:()=>{ V.importText=JSON.stringify({findings:[{text:'Short sleep the night before appears on 6 of 8 pain days.',level:'worth testing'},{text:'Skipped lunch plus 4+ coffees came before 3 attacks.',level:'hunch'}],experiments:[{title:'Lunch by 1:30 PM',rule:'Eat lunch by 1:30 PM on workdays, even on shoot days.',from:TODAY(),to:key(addDays(NOW(),21))}],food:[{rule:'No refined carbs or sweets after 4 PM',detail:'White bread, pasta, cake, soda, sugary tea.',until:key(addDays(NOW(),21)),why:'Testing evening sugar dips.'}],nudges:[{message:'Short night. Keep caffeine to the morning.',condition:'short_sleep',on:true}]},null,2); V.importResult=null; render(); },
  checkPlan:()=>{ V.importResult=checkPlan(V.importText); render(); },
  savePlan:()=>{ const p=V.importResult.plan; S.pastPlans.unshift({month:S.plan.month, findings:S.plan.findings.length, experiments:S.plan.experiments.length});
    S.plan={ month:MON[NOW().getMonth()]+' review', received:TODAY(), findings:p.findings, experiments:(p.experiments||[]).map((e,i)=>Object.assign({id:'e'+i,done:{},from:e.from||TODAY()},e)), food:(p.food||[]).map((f,i)=>Object.assign({id:'f'+(i+1),detail:'',why:''},f)), nudges:(p.nudges||[]).map((n,i)=>Object.assign({id:'n'+i},n)) };
    V.sheet=null; V.importText=''; V.importResult=null; save(); render(); toast('Plan saved'); },
  nudge:id=>{ const n=S.plan.nudges.find(x=>x.id===id); n.on=!n.on; save(); render(); },
  /* settings */
  band:(b,dir)=>{ if(b==='pain') S.bands.pain=clamp(S.bands.pain+ +dir,1,S.bands.great-1); else S.bands.great=clamp(S.bands.great+ +dir,S.bands.pain+1,10); save(); render(); },
  remToggle:()=>{ S.reminder.on=!S.reminder.on; save(); render(); },
  remTime:dir=>{ S.reminder.time=STEP15(S.reminder.time,+dir); save(); render(); },
  sc:f=>{ S.screen[f]=!S.screen[f]; save(); render(); },
  scLate:dir=>{ S.screen.lateAfter=STEP15(S.screen.lateAfter,+dir); save(); render(); },
  scBreak:dir=>{ S.screen.breakAfter=clamp(S.screen.breakAfter+ +dir*15,30,240); save(); render(); },
  scHeavy:dir=>{ S.screen.heavyFrom=clamp(S.screen.heavyFrom+ +dir,4,14); save(); render(); },
  disc:dev=>{ S.screen[dev].on=false; save(); render(); },
  paired:dev=>{ S.screen[dev].on=true; S.screen[dev].synced=hm(NOW()); V.sheet=null; save(); render(); toast('Connected'); },
  demo:t=>{ if(t==='late') notify('Still working at '+fmt12(hm(NOW()))+'.','Late nights came before most of your pain days (a hunch so far). Time to wind down?',['Winding down','Ask in 30 min']); if(t==='break') notify('2 hours on the Mac without a break.','Look at something far away for 20 seconds and roll your shoulders.'); if(t==='eve') notify('How was today?','One tap is enough.'); },
  notifX:()=>{ $('#layer').querySelectorAll('.notif').forEach(x=>x.remove()); },
  medToggle:id=>{ const m=S.meds.find(x=>x.id===id); m.active=!m.active; save(); render(); },
  medCls:c=>{ V.newMedCls=c; render(); },
  medAdd:()=>{ const n=V.newMed.trim(); if(!n) return; S.meds.push({id:'m'+Date.now(),name:n,cls:V.newMedCls==='triptan'?'triptan':'simple',nsaid:V.newMedCls==='nsaid',active:true}); V.newMed=''; save(); render(); toast('Added'); },
  tagDel:i=>{ S.tags.splice(+i,1); save(); render(); },
  tagAdd:()=>{ const t=V.newTag.trim().toLowerCase(); if(t&&!allTags().includes(t)) S.tags.push(t); V.newTag=''; save(); render(); },
  thresh:dir=>{ S.weather.threshold=clamp(S.weather.threshold+ +dir,2,12); save(); render(); },
  lastWd:v=>{ S.weather.lastWorkday=v; save(); render(); },
  theme:v=>{ S.theme=v; save(); render(); },
  nightDark:()=>{ S.nightDark=!S.nightDark; save(); render(); },
  clearSample:()=>{ const keep={name:S.name, theme:S.theme, nightDark:S.nightDark, lock:S.lock, notify:S.notify, sections:S.sections, health:S.health, device:S.device}; S=Object.assign(fresh(), keep, {onboarded:true}); day(TODAY()); save(); render(); toast('Sample data cleared'); },
  wipe:()=>{ if(V.delTyped!=='DELETE') return;
    if(S.notify&&S.notify.on) pushOff();
    if(S.health&&S.health.token) fetch('/api/health-pair',{method:'DELETE', headers:auth()}).catch(()=>{});
    try{ localStorage.removeItem(STORE); }catch(e){}
    S=fresh(); migrate(); save(); V.delTyped=''; V.ob=0; V.locked=false; V.forgot=false; go('onboard'); },
  /* notifications */
  pushOn:()=>pushOn(),
  pushOff:()=>{ pushOff(); toast('Notifications off'); },
  pushTest:()=>pushTest(),
  nT:(id,dir)=>{ S.notify[id]=STEP15(S.notify[id],+dir); save(); render(); },
  nOn:id=>{ S.notify[id] = S.notify[id] ? null : {morning:'08:00',midday:'13:00',water:'16:00',evening:'19:30',rating:'21:00'}[id]; save(); render(); },
  nFlag:f=>{ S.notify[f]=!S.notify[f]; save(); render(); },
  secT:(id,dir)=>{ S.sections[id]=STEP15(S.sections[id],+dir); save(); render(); },
  /* weather & health */
  wxNow:()=>{ fetchWx(true).then(()=>toast(S.weather.at?'Weather updated':'Couldn\'t reach Open-Meteo')); },
  healthOn:()=>healthOn(),
  healthOff:()=>{ if(confirm('Disconnect Apple Health? Your Shortcut stops working until you set it up again with the new code.')) healthOff(); },
  healthPull:()=>{ pullHealth().then(n=>toast(n?'Imported '+n+' update'+(n===1?'':'s')+' from Apple Health':'Nothing new yet')); },
  copy:what=>{ const t = what==='addr' ? location.origin+'/api/health' : 'Bearer '+S.health.token;
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Press and hold to copy')); else toast('Press and hold to copy'); },
  /* passcode */
  passSave:async()=>{ const p=V.pass1;
    if(!p){ V.passErr='Type a passcode first.'; render(); return; }
    if(p!==V.pass2){ V.passErr='The two don\'t match. Try again.'; V.pass2=''; render(); return; }
    await setPass(p); V.pass1=V.pass2=V.passErr='';
    const first=!S.onboarded; S.onboarded=true; save(); go('today'); toast(first?'Welcome to Mouch!':'Passcode saved'); afterUnlock(); },
  passChange:()=>{ V.pass1=V.pass2=V.passErr=''; go('setlock'); },
  lockNow:()=>{ V.locked=true; V.passIn=''; V.passErr=''; render(); },
  unlock:async()=>{ if(await checkPass(V.passIn)){ V.locked=false; V.passIn=''; V.passErr=''; render(); afterUnlock(); } else { V.passErr='That\'s not it. Try again.'; V.passIn=''; render(); } },
  forgot:v=>{ V.forgot=v==='1'; V.delTyped=''; render(); },
  /* onboarding */
  obNext:()=>{ if(V.ob<5){ V.ob++; render(); } },
  obSkip:()=>{ V.ob=5; render(); }
};
function selectPre(){ const p=$('#exportJson'); if(!p) return; const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected — copy it'); }

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.classList.contains('scrim') && e.target!==el) return; // clicks inside sheet bubble to scrim only when on scrim itself
  if(el.closest('.ro') || el.disabled) return; // read-only days and attacks
  const parts=el.dataset.a.split(':'); const fn=A[parts[0]];
  if(V.locked && !['unlock','forgot','wipe'].includes(parts[0])) return;
  if(fn){ e.preventDefault(); fn(...parts.slice(1)); }
});
document.addEventListener('input', e=>{
  const k=e.target.dataset && e.target.dataset.in; if(!k) return;
  if(k==='note'){ ciAns().note=e.target.value.slice(0,280); save(); const c=$('#noteCount'); if(c) c.textContent=e.target.value.length+' / 280'; return; }
  if(k==='ciFood'){ V.ciFood=e.target.value; return; }
  if(k==='name'){ S.name=e.target.value.slice(0,30); save(); return; }
  V[k]=e.target.value;
  if(k==='delTyped'){ const b=document.querySelector('[data-a="wipe"]'); if(b){ const ok=V.delTyped==='DELETE'; b.disabled=!ok; b.style.opacity=ok?'1':'.4'; } }
});
document.addEventListener('keydown', e=>{ const di=e.target.dataset&&e.target.dataset.in; if(e.key==='Enter' && di==='passIn'){ e.preventDefault(); A.unlock(); } if(e.key==='Enter' && (di==='pass1'||di==='pass2')){ e.preventDefault(); if(di==='pass1'&&!V.pass2){ const p2=$('#pass2'); if(p2) p2.focus(); } else A.passSave(); } if(e.key==='Enter' && e.target.dataset && e.target.dataset.in==='ciTag'){ e.preventDefault(); A.ciTagAdd(); } if(e.key==='Enter' && e.target.dataset && e.target.dataset.in==='ciFood'){ e.preventDefault(); const b=document.querySelector('[data-a^="foodAdd:"]'); if(b) b.click(); } if(e.key==='Escape' && V.sheet){ A.sheetClose(); } });

function maybeLate(){
  const now=NOW(), wd=now.getDay(), lastWd={Thu:4,Fri:5,Sat:6}[S.screen.lastWorkday]||5;
  const workday = wd>=1 && wd<=lastWd;
  if(S.screen.lateOn && (!S.screen.workdaysOnly||workday) && isLate(hm(now)) && !S.live) setTimeout(()=>notify('Still working at '+fmt12(hm(now))+'.','Late nights came before most of your pain days (a hunch so far). Time to wind down?',['Winding down','Ask in 30 min']), 1600);
}
// timer: redraw once a minute, no seconds. Also lets log sections unlock on screen.
let ticks=0;
setInterval(()=>{ ticks++; const t=$('#timer'); const a=S.live&&S.attacks.find(x=>x.id===S.live); if(t&&a) t.textContent=elapsed(a); else if((S.live||ticks%5===0) && V.view==='today' && !V.sheet) softRender(); }, 60000);

/* a tapped notification opens its log: ?open=morning on launch, or a message from the service worker */
let pendingOpen = new URLSearchParams(location.search).get('open');
if(pendingOpen) history.replaceState(null,'','/');
function handleOpen(x){
  x = x || pendingOpen; pendingOpen=null; if(!x) return;
  if(V.locked || !S.onboarded){ pendingOpen=x; return; }
  if(['morning','midday','evening'].includes(x)){ if(!openCheckin(TODAY(), x)) go('today'); }
  else if(x==='plan') go('plan');
  else if(x==='attack' && S.live) A.openLive();
  else go('today');
}
function afterUnlock(){ if(!S.onboarded) return; maybeLate(); handleOpen(); }
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e=>{ if(e.data && e.data.open) handleOpen(e.data.open); });

/* relock after 5 minutes away; fresh weather and Health on every return */
let hiddenAt=0;
function refresh(){ fetchWx(); pullHealth().then(n=>{ if(n && !V.locked) toast('Apple Health: '+n+' new update'+(n===1?'':'s')); }); queueSync(); }
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(S.lock && hiddenAt && Date.now()-hiddenAt>5*60e3){ V.locked=true; V.passIn=''; V.passErr=''; V.forgot=false; render(); }
  else softRender();
  hiddenAt=0; refresh();
});

render();
if(!V.locked) afterUnlock();
refresh();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
